name: Paydos bekci
# Kendi kendine devam eden zamanlayıcı: her çalışma ~5 sa 45 dk bekler, saati gelen paylaşımı
# dakikasında yapar, bitince kendini yeniden başlatır. GitHub zamanlayıcısı yalnızca yedek (zincir koparsa).
on:
  workflow_dispatch: {}
  push:
    paths: ["yayin/bekci_iste.txt"]
  schedule:
    - cron: "11 */6 * * *"
permissions:
  contents: write
  actions: write
  issues: write
concurrency: bekci
jobs:
  bekle:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git config user.name "paydos-robot" && git config user.email "robot@users.noreply.github.com"
      - name: Bekle ve saatinde paylas
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python yayin/bekci.py 345
      - name: Zinciri devam ettir
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bekci.yml --ref main -R ${{ github.repository }}
