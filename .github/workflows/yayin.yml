name: Paydos yayin robotu
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: yayin
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zamanı gelenleri paylaş
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python yayin/yayinla.py
      - name: Kaydı sakla
        run: |
          git config user.name "paydos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add yayin/kayit.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "yayin kaydi" && git push)
